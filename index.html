<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ritik Tyagi | Electrical & Automation Engineer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
  scroll-behavior:smooth;
}

body{
  background:#06101d;
  color:white;
  line-height:1.6;
}

/* NAVBAR */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#081a2d;
  padding:16px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #16466b;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#00d9ff;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:22px;
  font-weight:bold;
}

nav a:hover{
  color:#00d9ff;
}

/* HERO */
.hero{
  min-height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:50px 20px;
  background:
    radial-gradient(circle at top,#123d64,#06101d 65%);
}

.hero h1{
  font-size:55px;
  color:#00d9ff;
  margin-bottom:15px;
}

.hero h2{
  font-size:25px;
  color:#ddd;
  margin-bottom:20px;
}

.hero p{
  max-width:700px;
  margin:auto;
  color:#bbb;
  font-size:18px;
}

.buttons{
  margin-top:30px;
}

.btn{
  display:inline-block;
  padding:14px 28px;
  margin:8px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  background:#00d9ff;
  color:#001018;
}

.btn:hover{
  transform:scale(1.05);
}

.btn-outline{
  background:transparent;
  color:#00d9ff;
  border:2px solid #00d9ff;
}

/* SECTIONS */
section{
  padding:80px 8%;
}

.section-title{
  text-align:center;
  font-size:35px;
  color:#00d9ff;
  margin-bottom:40px;
}

/* ABOUT */
.about{
  max-width:900px;
  margin:auto;
  text-align:center;
  color:#ccc;
  font-size:18px;
}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.card{
  background:#0d2339;
  padding:30px 20px;
  border-radius:15px;
  text-align:center;
  border:1px solid #17496d;
  transition:.3s;
}

.card:hover{
  transform:translateY(-8px);
  border-color:#00d9ff;
}

.card .icon{
  font-size:40px;
  margin-bottom:15px;
}

.card h3{
  color:#00d9ff;
  margin-bottom:12px;
}

.card p{
  color:#bbb;
}

/* SKILLS */
.skills{
  max-width:850px;
  margin:auto;
}

.skill{
  margin-bottom:22px;
}

.skill-name{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
}

.bar{
  height:10px;
  background:#1a3045;
  border-radius:10px;
  overflow:hidden;
}

.progress{
  height:100%;
  background:#00d9ff;
  border-radius:10px;
}

.p1{width:85%}
.p2{width:75%}
.p3{width:70%}
.p4{width:65%}
.p5{width:60%}

/* PROJECTS */
.projects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
}

.project{
  background:#0d2339;
  padding:25px;
  border-radius:15px;
  border:1px solid #17496d;
}

.project h3{
  color:#00d9ff;
  margin-bottom:10px;
}

.project p{
  color:#bbb;
}

/* CONTACT */
.contact{
  background:#081a2d;
  text-align:center;
}

.contact-box{
  max-width:700px;
  margin:auto;
}

.contact p{
  margin:15px;
  font-size:18px;
  color:#ddd;
}

.contact a{
  color:#00d9ff;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  background:#030911;
  color:#888;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#25D366;
  color:white;
  padding:14px 18px;
  border-radius:50px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 5px 20px #000;
}
